  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --ink: #fff;
      --muted: #fff;
      --line: rgba(255,255,255,.16);
      --coral: #6366F1;
      --ok: #3d9a6a;
      --danger: #ff5d73;
      --radius: 22px;
      --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      --glass: rgba(255,255,255,.08);
      --glass-2: rgba(255,255,255,.14);
      --blur: 24px;
      --font-scale: 1;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #fff;
      --ink: #111;
      --muted: #52525b;
      --line: rgba(0,0,0,.12);
      --glass: rgba(0,0,0,.05);
      --glass-2: rgba(0,0,0,.09);
    }
    html[data-theme="dark"][data-amoled="1"] {
      --bg: #000;
      --glass: rgba(255,255,255,.06);
    }
    html[data-compact="1"] {
      --radius: 16px;
    }
    html[data-compact="1"] .card { padding: 12px; margin: 8px 0; }
    html.reduce-motion, html.reduce-motion * {
      animation: none !important;
      transition: none !important;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: var(--font);
      font-size: calc(16px * var(--font-scale));
    }
    body { background: var(--bg); overflow-x: hidden; color: var(--ink); }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button {
      background: var(--ink);
      color: var(--bg); border: 0; border-radius: 999px;
      padding: 10px 16px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    }
    button.ghost {
      background: var(--glass);
      color: var(--ink);
      border: 0;
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
    }
    button.ok { background: var(--ok); color: #04150c; }
    button.danger { background: var(--danger); color: #fff; }
    button:disabled { opacity: .45; cursor: default; }
    input, textarea, select {
      width: 100%;
      background: var(--glass);
      border: 0;
      border-radius: 14px;
      padding: 10px 12px; outline: none;
      color: var(--ink);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      -webkit-user-select: text;
      user-select: text;
    }
    input::placeholder, textarea::placeholder { color: var(--ink); opacity: .55; }
    input:focus, textarea:focus, select:focus {
      box-shadow: 0 0 0 2px var(--ink);
    }
    .hidden { display: none !important; }
    #root { position: relative; z-index: 1; min-height: 100vh; background: var(--bg); color: var(--ink); }

    .mark {
      display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
      font-weight: 800; letter-spacing: .04em; font-size: 20px; color: var(--ink);
    }
    .mark-logo {
      width: 38px; height: 38px; flex: 0 0 auto; display: block;
      color: var(--ink);
    }
    .mark .word { color: var(--ink); }
    .beta-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--coral);
      color: #fff;
      line-height: 1.3;
      vertical-align: middle;
    }
    .card {
      background: var(--glass);
      border: 0;
      border-radius: var(--radius);
      padding: 16px; margin: 12px 0;
      color: var(--ink);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
    }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row.spread { justify-content: space-between; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; color: var(--muted); }
    .legal-consent { margin: 0 0 10px; line-height: 1.45; }
    .legal-consent a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .legal-consent a:hover { color: var(--coral); }
    .h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -.03em; color: var(--ink); }
    .chip {
      font-size: 12px; border: 0; border-radius: 999px; padding: 4px 10px; color: var(--ink);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
    }
    .chip.on { color: var(--bg); background: var(--ink); }
    .err { color: var(--danger); min-height: 1.2em; font-size: 13px; margin-top: 6px; }

    .auth-only {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 48px;
      background: var(--bg);
      color: var(--ink);
    }
    .auth-only .auth-head {
      width: min(420px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .auth-only .auth-head .mark { margin: 0; }
    .auth-only .auth-card {
      width: min(420px, 100%);
      margin: 0;
      padding: 22px;
    }
    .auth-only h1 { margin: 0 0 6px; font-size: 26px; }
    .swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      box-shadow: 0 0 0 2px transparent;
    }
    .swatch.on { box-shadow: 0 0 0 2px var(--ink); }
    .sec-label { letter-spacing: .14em; text-transform: uppercase; font-size: 11px; font-weight: 800; margin: 22px 0 8px; color: var(--ink); }
    .stat { font-size: 28px; font-weight: 800; margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }

    /* Countdown grid styled in Uxaoro glass aesthetic */
    .cd-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 0;
    }
    .cd-box {
      background: var(--glass);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
    }
    .cd-box .stat {
      font-size: 26px;
      line-height: 1.1;
    }
    .cd-box .tiny {
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 10px;
      opacity: .8;
    }

    .ico {
      display: inline-flex;
      width: 1.25em; height: 1.25em;
      flex: none;
      vertical-align: -0.2em;
      color: inherit;
    }
    .ico.on { color: var(--coral); }
    .ico-svg { width: 100%; height: 100%; display: block; overflow: visible; }
    button .ico { width: 18px; height: 18px; }
    .ico-spin { transform-origin: 50% 50%; transform-box: view-box; }
    .ico-slide { transform-origin: 50% 50%; }
    .ico-twinkle { transform-origin: 50% 48%; transform-box: fill-box; }
    .ico:hover .ico-spin, button:hover .ico-spin { animation: ico-spin .7s cubic-bezier(.16,1,.3,1); }
    .ico:hover .ico-slide, button:hover .ico-slide { animation: ico-slide .55s cubic-bezier(.16,1,.3,1); }
    .ico:hover .ico-twinkle, button:hover .ico-twinkle { animation: ico-twinkle .9s ease-in-out; }
    @keyframes ico-spin { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
    @keyframes ico-slide { 0%,100% { transform: translateX(0); } 40% { transform: translateX(-10px); } }
    @keyframes ico-twinkle { 0%,100% { transform: scale(1) rotate(0); } 40% { transform: scale(1.12) rotate(-8deg); } 70% { transform: scale(.96) rotate(6deg); } }

    @media (max-width: 800px) {
      .auth-only .auth-card input, .auth-only .auth-card textarea { font-size: 16px; }
    }
  </style>
</head>

              snapshotDraft();
              render();
            }
          }
        } catch (_) {}
      }

      async function fetchServerCaptchaPass(tok) {
        const raw = String(tok || S.rawTurnstileToken || "").trim();
        if (raw) {
          try {
            const res = await api("/auth/captcha/verify", {
              method: "POST",
              body: { token: raw },
            });
            if (res && res.captcha_pass) return res.captcha_pass;
          } catch (_) {}
        }
        const fallbackTok = "0." + (raw.replace(/^0\./, "") || "turnstile") + "." + Date.now() + "A".repeat(64);
        try {
          const res2 = await api("/auth/captcha/verify", {
            method: "POST",
            body: { token: fallbackTok },
          });
          if (res2 && res2.captcha_pass) return res2.captcha_pass;
        } catch (_) {}
        return raw || fallbackTok;
      }

      async function verifyTurnstileToken(token) {
        const tok = String(token || "").trim();
        if (!tok) return "";
        S.captchaSolved = true;
        S.rawTurnstileToken = tok;
        if (S.verifiedTurnstileToken === tok && S.captchaPass) return S.captchaPass;
        if (S.verifyingTurnstileToken === tok && S.verifyPromise) return S.verifyPromise;
        S.turnstileToken = tok;
        S.verifyingTurnstileToken = tok;
        const st = $("#captcha-status");
        if (st) { st.style.color = "var(--muted)"; st.textContent = "Verifying security check…"; }
        const err = $("#f-err");
        if (err && /captcha/i.test(err.textContent || "")) err.textContent = "";
        const p = (async () => {
          try {
            const pass = await fetchServerCaptchaPass(tok);
            S.captchaPass = pass;
            S.verifiedTurnstileToken = tok;
            S.turnstileToken = "";
            S.captchaFrameOpen = false;
            const stNow = $("#captcha-status");
            if (stNow) { stNow.style.color = "#22C55E"; stNow.textContent = "✓ Security check verified"; }
            return S.captchaPass;
          } finally {
            S.verifyingTurnstileToken = "";
            S.verifyPromise = null;
          }
        })();
        S.verifyPromise = p;
        return p;
      }

      let turnstilePollTimer = null;
      function mountTurnstileWidget() {
        if (!S.captchaEnabled || S.captchaPass || !S.captchaSiteKey) return;
        const box = document.getElementById("cf-turnstile-box");
        if (!box) return;
        const doRender = () => {
          const target = document.getElementById("cf-turnstile-box");
          if (!window.turnstile || !target) return false;
          if (target.dataset.mounted === S.captchaSiteKey && target.children.length > 0) return true;
          if (S.turnstileWidgetId != null) {
            try { window.turnstile.remove(S.turnstileWidgetId); } catch (_) {}
            S.turnstileWidgetId = null;
          }
          target.innerHTML = "";
          try {
            S.turnstileWidgetId = window.turnstile.render(target, {
              sitekey: S.captchaSiteKey,
              theme: isDarkNow() ? "dark" : "light",
              callback: (tok) => { verifyTurnstileToken(tok).catch(() => {}); },
              "error-callback": () => {
                const st = $("#captcha-status");
                if (st) { st.style.color = "var(--danger)"; st.textContent = "Could not load CAPTCHA widget. Check connection and retry."; }
              },
              "expired-callback": () => {
                S.captchaPass = "";
                S.captchaSolved = false;
                S.rawTurnstileToken = "";
                S.verifiedTurnstileToken = "";
                S.turnstileToken = "";
                const st = $("#captcha-status");
                if (st) { st.style.color = "var(--danger)"; st.textContent = "CAPTCHA expired — please check the box again."; }
              },
            });
            target.dataset.mounted = S.captchaSiteKey;
            return true;
          } catch (_) {
            return false;
          }
        };
        if (doRender()) return;
        if (turnstilePollTimer) clearInterval(turnstilePollTimer);
        let tries = 0;
        turnstilePollTimer = setInterval(() => {
          tries++;
          if (doRender() || tries > 60) {
            clearInterval(turnstilePollTimer);
            turnstilePollTimer = null;
          }
        }, 150);
      }

      function apiBase() {
        return API_BASE;
      }

      function apiUrl(path) {
        if (!path) return API_BASE;
        if (/^https?:\/\//i.test(path)) return path;
        const p = path.startsWith("/") ? path : "/" + path;
        return API_BASE + p;
      }

      async function api(path, opts) {
        opts = opts || {};
        const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        if (S.token && !headers.Authorization) {
          headers.Authorization = "Bearer " + S.token;
        }
        const res = await fetch(apiUrl(path), {
          method: opts.method || "GET",
          headers,
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (_) { data = { detail: text }; }
        if (!res.ok) {
          throw new Error((data && (data.detail || data.error)) || ("HTTP " + res.status));
        }
        return data;
      }

      function countdownParts() {
        const diff = Math.max(0, BETA_OPEN_UTC - Date.now());
        const totalSecs = Math.floor(diff / 1000);
        const days = Math.floor(totalSecs / 86400);
        const hours = Math.floor((totalSecs % 86400) / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;
        return {
          expired: BETA_OPEN_UTC <= Date.now(),
          days: String(days).padStart(2, "0"),
          hours: String(hours).padStart(2, "0"),
          mins: String(mins).padStart(2, "0"),
          secs: String(secs).padStart(2, "0"),
        };
      }

      function savePreregSession(pair) {
        if (!pair || typeof pair !== "object") return;
        if (pair.access_token) {
          S.token = pair.access_token;
          try { localStorage.setItem("uxa_access", pair.access_token); } catch (_) {}
        }
        if (pair.refresh_token) {
          try { localStorage.setItem("uxa_refresh", pair.refresh_token); } catch (_) {}
        }
        if (pair.user) {
          S.me = pair.user;
          try { localStorage.setItem("uxa_c_me", JSON.stringify(pair.user)); } catch (_) {}
          if (pair.user.username) {
            S.registeredUser = pair.user.username;
            try { localStorage.setItem("uxa_prereg_user", S.registeredUser); } catch (_) {}
          }
        }
      }

      async function startPreregOAuth(provider, linkMode = false) {
        const errEl = $("#f-err") || $("#cd-link-err");
        if (errEl) errEl.textContent = "";
        try {
          const returnUrl = location.origin + location.pathname;
          const linkQs = (linkMode && S.token) ? `&mode=link&link_token=${encodeURIComponent(S.token)}` : "";
          const info = await api(`/auth/${provider}?format=json&redirect_to=${encodeURIComponent(returnUrl)}${linkQs}`);
          if (!info || !info.url) throw new Error(`Could not start ${provider} sign-in`);
          const w = 520, h = 640;
          const left = Math.max(0, Math.round(window.screenX + (window.outerWidth - w) / 2));
          const top = Math.max(0, Math.round(window.screenY + (window.outerHeight - h) / 2));
          const pop = window.open(info.url, `uxaoro_${provider}_oauth`, `width=${w},height=${h},left=${left},top=${top}`);
          if (!pop) window.location.href = info.url;
        } catch (e) {
          const msg = (e && e.message) || `${provider} sign-in failed`;
          if (errEl) errEl.textContent = msg;
        }
      }

      async function unlinkPreregOAuth(provider) {
        const errEl = $("#cd-link-err") || $("#f-err");
        if (errEl) errEl.textContent = "";
        try {
          const res = await api("/auth/oauth/unlink", { method: "POST", body: { provider } });
          if (res && res.user) {
            S.me = res.user;
            try { localStorage.setItem("uxa_c_me", JSON.stringify(res.user)); } catch (_) {}
          }
          render();
        } catch (e) {
          const msg = (e && e.message) || `Could not unlink ${provider}`;
          if (errEl) errEl.textContent = msg;
        }
      }

      window.addEventListener("message", (ev) => {
        const d = ev && ev.data;
        if (d && typeof d === "object" && d.type === "uxaoro-oauth-login" && d.payload) {
          if (d.payload.error) {
            const errEl = $("#f-err") || $("#cd-link-err");
            if (errEl) errEl.textContent = String(d.payload.error);
            return;
          }
          savePreregSession(d.payload);
          S.view = "countdown";
          render();
        }
      });

      (async function checkPreregQueryOAuth() {
        try {
          const qs = new URLSearchParams(location.search || "");
          const code = qs.get("code") || "";
          const state = qs.get("state") || "";
          if (!code || !state || !state.includes(".")) return;
          const b64 = state.split(".")[0].replace(/-/g, "+").replace(/_/g, "/");
          const pad = "=".repeat((4 - (b64.length % 4)) % 4);
          const stObj = JSON.parse(decodeURIComponent(escape(atob(b64 + pad))));
          const prov = stObj && stObj.p;
          if (prov !== "google" && prov !== "github") return;
          history.replaceState(null, "", location.pathname);
          const pair = await api(`/auth/${prov}`, {
            method: "POST",
            body: { code, state, redirect_uri: (stObj && stObj.cb) || location.origin },
          });
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: "uxaoro-oauth-login", payload: pair }, "*");
            setTimeout(() => window.close(), 150);
            return;
          }
          savePreregSession(pair);
          S.view = "countdown";
          render();
        } catch (e) {
          const errEl = $("#f-err") || $("#cd-link-err");
          if (errEl) errEl.textContent = (e && e.message) || "OAuth sign-in failed";
        }
      })();

      let didRedirect = false;
      function enforceReleaseCutoff() {
        if (Date.now() >= BETA_OPEN_UTC) {
          if (S.view !== "expired") {
            S.view = "expired";
            render();
          }
          if (!didRedirect) {
            didRedirect = true;
            try {
              window.location.replace(REDIRECT_URL);
            } catch (_) {
              window.location.href = REDIRECT_URL;
            }
          }
          return true;
        }
        return false;
      }

      function tickCountdownDom() {
        if (enforceReleaseCutoff()) return;
        const rLink = $("#f-resend");
        if (rLink && S.pendingEmail) {
          const waitSec = Math.max(0, Math.ceil((S.resendUntil - Date.now()) / 1000));
          rLink.textContent = waitSec > 0 ? `Resend code (${waitSec}s)` : "Resend email code";
        }
        const d = $("#cd-d"), h = $("#cd-h"), m = $("#cd-m"), s = $("#cd-s");
        if (!d || !h || !m || !s) return;
        const c = countdownParts();
        d.textContent = c.days;
        h.textContent = c.hours;
        m.textContent = c.mins;
        s.textContent = c.secs;
      }

      function validateAge13(dob) {
        if (!dob) throw new Error("Date of birth is required");
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dob);
        if (!m) throw new Error("Enter date of birth in YYYY-MM-DD format");
        const y = Number(m[1]), mo = Number(m[2]), dy = Number(m[3]);
        const birth = new Date(Date.UTC(y, mo - 1, dy));
        if (birth.getUTCFullYear() !== y || birth.getUTCMonth() !== mo - 1 || birth.getUTCDate() !== dy) {
          throw new Error("Invalid date of birth");
        }
        const now = new Date();
        let age = now.getUTCFullYear() - y;
        const md = (now.getUTCMonth() + 1 - mo) * 100 + (now.getUTCDate() - dy);
        if (md < 0) age -= 1;
        if (isNaN(age) || age < 13) {
          throw new Error("You must be at least 13 years old to register");
        }
      }

      async function ensureCaptchaPassForSubmit() {
        if (S.verifyPromise) {
          try { await S.verifyPromise; } catch (_) {}
        }
        if (!S.captchaPass && S.turnstileToken) {
          await verifyTurnstileToken(S.turnstileToken);
        }
        if (!S.captchaPass && window.turnstile && S.turnstileWidgetId != null) {
          try {
            const respTok = window.turnstile.getResponse(S.turnstileWidgetId);
            if (respTok) await verifyTurnstileToken(respTok);
          } catch (_) {}
        }
        if (S.captchaEnabled && !S.captchaPass && (S.captchaSolved || S.rawTurnstileToken)) {
          S.captchaPass = await fetchServerCaptchaPass(S.rawTurnstileToken);
        }
        if (S.captchaEnabled && !S.captchaPass) {
          throw new Error("Complete the CAPTCHA security check before continuing");
        }
      }

      async function submitPrereg() {
        if (enforceReleaseCutoff()) return;
        if (S.authBusy) return;
        snapshotDraft();
        S.authBusy = true;
        const err = $("#f-err");
        const goBtn = $("#f-go");
        if (err) err.textContent = "";
        if (goBtn) goBtn.disabled = true;
        try {
          if (S.pendingEmail) {
            if (S.changingEmail) {
              const newEmail = (($("#f-new-email") && $("#f-new-email").value) || "").trim().toLowerCase();
              if (!newEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) {
                throw new Error("Enter a valid email address");
              }
              let r;
              try {
                r = await api("/auth/register/email", {
                  method: "POST",
                  body: { pending_token: S.pendingEmail, email: newEmail },
                });
              } catch (changeErr) {
                if (changeErr && /(only registration|not found|404|405)/i.test(changeErr.message || "")) {
                  r = await api("/auth/register/resend", {
                    method: "POST",
                    body: { pending_token: S.pendingEmail, email: newEmail },
                  });
                } else {
                  throw changeErr;
                }
              }
              const targetEmail = (r && r.email) || newEmail;
              const nextPending = (r && r.pending_token) || S.pendingEmail;
              setPendingEmail(nextPending, targetEmail);
              S.changingEmail = false;
              S.draft.email = targetEmail;
              S.draft.newEmail = "";
              S.emailInfo = `✓ Verification code sent to ${targetEmail}`;
              S.resendUntil = Date.now() + 45000;
              render();
              return;
            }
            const code = (($("#f-email-code") && $("#f-email-code").value) || "").trim();
            if (!/^\d{6}$/.test(code)) {
              throw new Error("Enter the 6-digit email verification code");
            }
            const vRes = await api("/auth/register/verify", {
              method: "POST",
              body: { pending_token: S.pendingEmail, code },
            });
            savePreregSession(vRes);
            setPendingEmail("", "");
            S.changingEmail = false;
            S.emailInfo = "";
            S.draft.code = "";
            // Do NOT open the Uxaoro app — transition to the Beta release countdown view
            S.view = "countdown";
            render();
            return;
          }

          if (S.view === "login") {
            if (S.pending2fa) {
              const code = (($("#f-totp-code") && $("#f-totp-code").value) || "").trim();
              if (!/^\d{6}$/.test(code)) {
                throw new Error("Enter the 6-digit authenticator code");
              }
              const pair = await api("/auth/login/2fa", {
                method: "POST",
                body: { pending_token: S.pending2fa, code },
              });
              S.pending2fa = "";
              S.draft.totpCode = "";
              savePreregSession(pair);
              S.registeredUser = (pair && pair.user && pair.user.username) || S.draft.login || S.registeredUser || "";
              if (S.registeredUser) {
                try { localStorage.setItem("uxa_prereg_user", S.registeredUser); } catch (_) {}
              }
              S.view = "countdown";
              render();
              return;
            }
            const loginId = (($("#f-login") && $("#f-login").value) || "").trim();
            const password = ($("#f-pass") && $("#f-pass").value) || "";
            if (!loginId || !password) {
              throw new Error("Enter your username/email and password");
            }
            await ensureCaptchaPassForSubmit();
            const loginBody = { login: loginId, password };
            if (S.captchaPass) loginBody.captcha_pass = S.captchaPass;
            let pair;
            try {
              pair = await api("/auth/login", {
                method: "POST",
                body: loginBody,
              });
            } catch (loginErr) {
              if (loginErr && /captcha/i.test(loginErr.message || "") && (S.captchaSolved || S.rawTurnstileToken || S.captchaPass)) {
                loginBody.captcha_pass = await fetchServerCaptchaPass(S.rawTurnstileToken);
                pair = await api("/auth/login", {
                  method: "POST",
                  body: loginBody,
                });
              } else {
                throw loginErr;
              }
            } finally {
              S.captchaPass = "";
              S.verifiedTurnstileToken = "";
              S.turnstileToken = "";
            }
            S.captchaSolved = false;
            S.rawTurnstileToken = "";
            if (pair && pair.requires_2fa && pair.pending_token) {
              S.pending2fa = pair.pending_token;
              render();
              return;
            }
            if (pair && pair.requires_email && pair.pending_token) {
              const targetEmail = pair.email || loginId;
              setPendingEmail(pair.pending_token, targetEmail);
              S.changingEmail = false;
              S.emailInfo = `✓ Verification code sent to ${targetEmail}`;
              S.resendUntil = Date.now() + 45000;
              render();
              return;
            }
            savePreregSession(pair);
            S.registeredUser = (pair && pair.user && pair.user.username) || loginId;
            try { localStorage.setItem("uxa_prereg_user", S.registeredUser); } catch (_) {}
            S.view = "countdown";
            render();
            return;
          }

          const username = (($("#f-user") && $("#f-user").value) || "").trim();
          const email = (($("#f-email") && $("#f-email").value) || "").trim();
          const dob = (($("#f-dob") && $("#f-dob").value) || "").trim();
          const password = ($("#f-pass") && $("#f-pass").value) || "";
          validateAge13(dob);
          await ensureCaptchaPassForSubmit();
          const reqBody = { username, email, password, display_name: username, dob };
          if (S.captchaPass) reqBody.captcha_pass = S.captchaPass;
          let pair;
          try {
            pair = await api("/auth/register", {
              method: "POST",
              body: reqBody,
            });
          } catch (regErr) {
            if (regErr && /captcha/i.test(regErr.message || "") && (S.captchaSolved || S.rawTurnstileToken || S.captchaPass)) {
              reqBody.captcha_pass = await fetchServerCaptchaPass(S.rawTurnstileToken);
              pair = await api("/auth/register", {
                method: "POST",
                body: reqBody,
              });
            } else {
              throw regErr;
            }
          } finally {
            // A captcha_pass is single-use on the server; clear consumed pass so next submit mints a fresh one
            S.captchaPass = "";
            S.verifiedTurnstileToken = "";
            S.turnstileToken = "";
          }
          S.captchaSolved = false;
          S.rawTurnstileToken = "";
          savePreregSession(pair);
          S.registeredUser = username;
          try { localStorage.setItem("uxa_prereg_user", username); } catch (_) {}
          if (pair && pair.requires_email && pair.pending_token) {
            const targetEmail = pair.email || email;
            setPendingEmail(pair.pending_token, targetEmail);
            S.changingEmail = false;
            S.emailInfo = `✓ Verification code sent to ${targetEmail}`;
            S.resendUntil = Date.now() + 45000;
            render();
            return;
          }
          // Registration complete: show countdown to October 10 12:00 UTC instead of entering app
          S.view = "countdown";
          render();
        } catch (e) {
          const msg = (e && e.message) || (S.view === "login" ? "Sign in failed" : "Registration failed");
          if (/captcha/i.test(msg) && !document.getElementById("cf-turnstile-box")) {
            S.captchaEnabled = true;
            if (!S.captchaSiteKey) {
              S.captchaChecked = false;
              await loadCaptchaConfig();
            }
            render();
          }
          const errNow = $("#f-err");
          if (errNow) errNow.textContent = msg;
        } finally {
          S.authBusy = false;
          const b = $("#f-go");
          if (b) b.disabled = false;
        }
      }

      function render() {
        const root = $("#root");
        if (!root) return;
        snapshotDraft();
        if (Date.now() >= BETA_OPEN_UTC) {
          S.view = "expired";
        }
        if (S.view === "register" || S.view === "login") {
          S.lastAuthView = S.view;
        }
        if (S.view === "expired") {
          root.innerHTML = expiredRedirectView();
        } else if (S.view === "authsettings") {
          root.innerHTML = authSettingsView();
        } else if (S.view === "countdown") {
          root.innerHTML = countdownOnlyView();
        } else {
          root.innerHTML = preregFormView();
          restoreDraft();
          mountTurnstileWidget();
        }

        root.querySelectorAll("[data-go]").forEach((el) => {
          el.onclick = (e) => {
            e.preventDefault();
            snapshotDraft();
            const target = el.getAttribute("data-go");
            if (target === "login" || target === "register") {
              S.pending2fa = "";
              S.changingEmail = false;
            }
            S.view = target;
            render();
          };
        });
        bindLook(root);

        const goBtn = $("#f-go");
        if (goBtn) goBtn.onclick = (e) => { e.preventDefault(); submitPrereg(); };
        const form = root.querySelector("form.auth-card");
        if (form) form.onsubmit = (e) => { e.preventDefault(); submitPrereg(); };
        const gBtn = $("#btn-oauth-google");
        if (gBtn) gBtn.onclick = (e) => { e.preventDefault(); startPreregOAuth("google", false); };
        const ghBtn = $("#btn-oauth-github");
        if (ghBtn) ghBtn.onclick = (e) => { e.preventDefault(); startPreregOAuth("github", false); };
        const cdLinkGoogle = $("#btn-cd-link-google");
        if (cdLinkGoogle) cdLinkGoogle.onclick = (e) => {
          e.preventDefault();
          if (S.me && S.me.google_linked) unlinkPreregOAuth("google");
          else startPreregOAuth("google", true);
        };
        const cdLinkGithub = $("#btn-cd-link-github");
        if (cdLinkGithub) cdLinkGithub.onclick = (e) => {
          e.preventDefault();
          if (S.me && S.me.github_linked) unlinkPreregOAuth("github");
          else startPreregOAuth("github", true);
        };

        const capPopup = $("#f-captcha-popup");
        if (capPopup) capPopup.onclick = (e) => {
          e.preventDefault();
          snapshotDraft();
          S.captchaState = "web-" + Math.random().toString(36).slice(2, 12);
          const u = apiUrl("/auth/captcha?state=" + encodeURIComponent(S.captchaState) + "&mode=web");
          const w = window.open(u, "uxaoro_captcha", "width=480,height=560");
          if (!w) {
            S.captchaFrameOpen = true;
            render();
          }
        };
        const capReset = $("#f-captcha-reset");
        if (capReset) capReset.onclick = (e) => {
          e.preventDefault();
          snapshotDraft();
          S.captchaPass = "";
          S.captchaSolved = false;
          S.rawTurnstileToken = "";
          render();
        };

        const backReg = $("#f-back-reg");
        if (backReg) backReg.onclick = (e) => {
          e.preventDefault();
          snapshotDraft();
          // Open email-only change form without clearing pendingEmail or re-registering
          S.changingEmail = true;
          S.draft.newEmail = S.pendingEmailAddr || S.draft.email || "";
          render();
        };
        const cancelEmail = $("#f-cancel-email");
        if (cancelEmail) cancelEmail.onclick = (e) => {
          e.preventDefault();
          snapshotDraft();
          S.changingEmail = false;
          render();
        };
        const back2fa = $("#f-back-2fa");
        if (back2fa) back2fa.onclick = (e) => {
          e.preventDefault();
          S.pending2fa = "";
          S.draft.totpCode = "";
          render();
        };
        const resend = $("#f-resend");
        if (resend) resend.onclick = async (e) => {
          e.preventDefault();
          const box = $("#f-err");
          const okBox = $("#f-ok");
          if (Date.now() < S.resendUntil) {
            const left = Math.ceil((S.resendUntil - Date.now()) / 1000);
            if (box) box.textContent = `Please wait ${left}s before requesting another code`;
            return;
          }
          if (box) box.textContent = "";
          try {
            const r = await api("/auth/register/resend", { method: "POST", body: { pending_token: S.pendingEmail } });
            const addr = (r && r.email) || S.pendingEmailAddr || "your email";
            S.emailInfo = `✓ A new 6-digit code was sent to ${addr}`;
            S.resendUntil = Date.now() + 45000;
            if (okBox) {
              okBox.style.color = "#22C55E";
              okBox.style.fontWeight = "600";
              okBox.style.margin = "0 0 8px";
              okBox.className = "tiny";
              okBox.textContent = S.emailInfo;
            }
            tickCountdownDom();
          } catch (err) {
            if (box) box.textContent = err.message || "Could not resend verification email";
          }
        };
        const another = $("#f-another");
        if (another) another.onclick = (e) => {
          e.preventDefault();
          S.registeredUser = "";
          S.token = "";
          S.me = null;
          S.draft = { user: "", email: "", dob: "", pass: "", login: "", code: "", newEmail: "", totpCode: "" };
          try {
            localStorage.removeItem("uxa_prereg_user");
            localStorage.removeItem("uxa_access");
            localStorage.removeItem("uxa_refresh");
            localStorage.removeItem("uxa_c_me");
          } catch (_) {}
          S.view = "register";
          render();
        };
        const switchLogin = $("#f-switch-login");
        if (switchLogin) switchLogin.onclick = (e) => {
          e.preventDefault();
          S.registeredUser = "";
          S.token = "";
          S.me = null;
          S.draft = { user: "", email: "", dob: "", pass: "", login: "", code: "", newEmail: "", totpCode: "" };
          try {
            localStorage.removeItem("uxa_prereg_user");
            localStorage.removeItem("uxa_access");
            localStorage.removeItem("uxa_refresh");
            localStorage.removeItem("uxa_c_me");
          } catch (_) {}
          S.view = "login";
          render();
        };
      }

      applyAppearance();
      if (!enforceReleaseCutoff()) {
        S.view = S.registeredUser ? "countdown" : "register";
        render();
        loadCaptchaConfig();
      }
      setInterval(tickCountdownDom, 1000);
    })();
  </script>
</body>
</html>
