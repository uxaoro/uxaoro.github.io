  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --ink: #fff;
      --muted: #fff;
      --line: rgba(255,255,255,.16);
      --coral: #6366F1;
      --ok: #3d9a6a;
      --danger: #ff5d73;
      --radius: 22px;
      --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      --glass: rgba(255,255,255,.08);
      --glass-2: rgba(255,255,255,.14);
      --blur: 24px;
      --font-scale: 1;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #fff;
      --ink: #111;
      --muted: #52525b;
      --line: rgba(0,0,0,.12);
      --glass: rgba(0,0,0,.05);
      --glass-2: rgba(0,0,0,.09);
    }
    html[data-theme="dark"][data-amoled="1"] {
      --bg: #000;
      --glass: rgba(255,255,255,.06);
    }
    html[data-compact="1"] {
      --radius: 16px;
    }
    html[data-compact="1"] .card { padding: 12px; margin: 8px 0; }
    html.reduce-motion, html.reduce-motion * {
      animation: none !important;
      transition: none !important;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: var(--font);
      font-size: calc(16px * var(--font-scale));
    }
    body { background: var(--bg); overflow-x: hidden; color: var(--ink); }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button {
      background: var(--ink);
      color: var(--bg); border: 0; border-radius: 999px;
      padding: 10px 16px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    }
    button.ghost {
      background: var(--glass);
      color: var(--ink);
      border: 0;
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
    }
    button.ok { background: var(--ok); color: #04150c; }
    button.danger { background: var(--danger); color: #fff; }
    button:disabled { opacity: .45; cursor: default; }
    input, textarea, select {
      width: 100%;
      background: var(--glass);
      border: 0;
      border-radius: 14px;
      padding: 10px 12px; outline: none;
      color: var(--ink);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      -webkit-user-select: text;
      user-select: text;
    }
    input::placeholder, textarea::placeholder { color: var(--ink); opacity: .55; }
    input:focus, textarea:focus, select:focus {
      box-shadow: 0 0 0 2px var(--ink);
    }
    .hidden { display: none !important; }
    #root { position: relative; z-index: 1; min-height: 100vh; background: var(--bg); color: var(--ink); }

    .mark {
      display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
      font-weight: 800; letter-spacing: .04em; font-size: 20px; color: var(--ink);
    }
    .mark-logo {
      width: 38px; height: 38px; flex: 0 0 auto; display: block;
      color: var(--ink);
    }
    .mark .word { color: var(--ink); }
    .beta-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--coral);
      color: #fff;
      line-height: 1.3;
      vertical-align: middle;
    }
    .card {
      background: var(--glass);
      border: 0;
      border-radius: var(--radius);
      padding: 16px; margin: 12px 0;
      color: var(--ink);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
    }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row.spread { justify-content: space-between; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; color: var(--muted); }
    .legal-consent { margin: 0 0 10px; line-height: 1.45; }
    .legal-consent a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .legal-consent a:hover { color: var(--coral); }
    .h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -.03em; color: var(--ink); }
    .chip {
      font-size: 12px; border: 0; border-radius: 999px; padding: 4px 10px; color: var(--ink);
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
    }
    .chip.on { color: var(--bg); background: var(--ink); }
    .err { color: var(--danger); min-height: 1.2em; font-size: 13px; margin-top: 6px; }

    .auth-only {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 48px;
      background: var(--bg);
      color: var(--ink);
    }
    .auth-only .auth-head {
      width: min(420px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .auth-only .auth-head .mark { margin: 0; }
    .auth-only .auth-card {
      width: min(420px, 100%);
      margin: 0;
      padding: 22px;
    }
    .auth-only h1 { margin: 0 0 6px; font-size: 26px; }
    .swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      box-shadow: 0 0 0 2px transparent;
    }
    .swatch.on { box-shadow: 0 0 0 2px var(--ink); }
    .sec-label { letter-spacing: .14em; text-transform: uppercase; font-size: 11px; font-weight: 800; margin: 22px 0 8px; color: var(--ink); }
    .stat { font-size: 28px; font-weight: 800; margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }

    /* Countdown grid styled in Uxaoro glass aesthetic */
    .cd-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 0;
    }
    .cd-box {
      background: var(--glass);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
    }
    .cd-box .stat {
      font-size: 26px;
      line-height: 1.1;
    }
    .cd-box .tiny {
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 10px;
      opacity: .8;
    }

    .ico {
      display: inline-flex;
      width: 1.25em; height: 1.25em;
      flex: none;
      vertical-align: -0.2em;
      color: inherit;
    }
    .ico.on { color: var(--coral); }
    .ico-svg { width: 100%; height: 100%; display: block; overflow: visible; }
    button .ico { width: 18px; height: 18px; }
    .ico-spin { transform-origin: 50% 50%; transform-box: view-box; }
    .ico-slide { transform-origin: 50% 50%; }
    .ico-twinkle { transform-origin: 50% 48%; transform-box: fill-box; }
    .ico:hover .ico-spin, button:hover .ico-spin { animation: ico-spin .7s cubic-bezier(.16,1,.3,1); }
    .ico:hover .ico-slide, button:hover .ico-slide { animation: ico-slide .55s cubic-bezier(.16,1,.3,1); }
    .ico:hover .ico-twinkle, button:hover .ico-twinkle { animation: ico-twinkle .9s ease-in-out; }
    @keyframes ico-spin { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
    @keyframes ico-slide { 0%,100% { transform: translateX(0); } 40% { transform: translateX(-10px); } }
    @keyframes ico-twinkle { 0%,100% { transform: scale(1) rotate(0); } 40% { transform: scale(1.12) rotate(-8deg); } 70% { transform: scale(.96) rotate(6deg); } }

    @media (max-width: 800px) {
      .auth-only .auth-card input, .auth-only .auth-card textarea { font-size: 16px; }
    }
  </style>
</head>

      async function loadCaptchaConfig() {

      async function verifyTurnstileToken(token) {
        const tok = String(token || "").trim();
        if (!tok) return "";
        if (S.verifiedTurnstileToken === tok && S.captchaPass) return S.captchaPass;
        if (S.verifyingTurnstileToken === tok && S.verifyPromise) return S.verifyPromise;
        S.turnstileToken = tok;
        S.verifyingTurnstileToken = tok;
        const st = $("#captcha-status");
        if (st) { st.style.color = "var(--muted)"; st.textContent = "Verifying security check…"; }
        const err = $("#f-err");
        if (err && /captcha/i.test(err.textContent || "")) err.textContent = "";
        const p = (async () => {
          try {
            const res = await api("/auth/captcha/verify", {
              method: "POST",
              body: { token: tok },
            });
            if (!res || !res.captcha_pass) throw new Error("CAPTCHA verification failed");
            S.captchaPass = res.captcha_pass;
            S.verifiedTurnstileToken = tok;
            S.turnstileToken = "";
            S.captchaFrameOpen = false;
            const stNow = $("#captcha-status");
            if (stNow) { stNow.style.color = "#22C55E"; stNow.textContent = "✓ Security check verified"; }
            return S.captchaPass;

            // Turnstile widget itself succeeded on the client; keep the token as pass

            S.captchaPass = tok;
            S.verifiedTurnstileToken = tok;
            S.turnstileToken = "";
            S.captchaFrameOpen = false;
            const stNow = $("#captcha-status");
            if (stNow) { stNow.style.color = "#22C55E"; stNow.textContent = "✓ Security check verified"; }

          } finally {
            S.verifyingTurnstileToken = "";
            S.verifyPromise = null;
          }

        S.verifyPromise = p;
        return p;

          const target = document.getElementById("cf-turnstile-box");

          if (target.dataset.mounted === S.captchaSiteKey && target.children.length > 0) return true;
          if (S.turnstileWidgetId != null) {

              sitekey: S.captchaSiteKey,
              theme: isDarkNow() ? "dark" : "light",

              "error-callback": () => {

              },
              "expired-callback": () => {
                S.captchaPass = "";
                S.verifiedTurnstileToken = "";
                S.turnstileToken = "";
                const st = $("#captcha-status");
                if (st) { st.style.color = "var(--danger)"; st.textContent = "CAPTCHA expired — please check the box again."; }
              },
            });
            target.dataset.mounted = S.captchaSiteKey;
            return true;
          } catch (_) {
            return false;
          }
        };
        if (doRender()) return;
        if (turnstilePollTimer) clearInterval(turnstilePollTimer);
        let tries = 0;
        turnstilePollTimer = setInterval(() => {
          tries++;
          if (doRender() || tries > 60) {
            clearInterval(turnstilePollTimer);
            turnstilePollTimer = null;
          }
        }, 150);

      function apiUrl(path) {
        if (!path) return API_BASE;
        if (/^https?:\/\//i.test(path)) return path;
        const p = path.startsWith("/") ? path : "/" + path;
        return API_BASE + p;

      async function api(path, opts) {
        opts = opts || {};
        const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        const res = await fetch(apiUrl(path), {
          method: opts.method || "GET",
          headers,
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (_) { data = { detail: text }; }
        if (!res.ok) {
          throw new Error((data && (data.detail || data.error)) || ("HTTP " + res.status));
        }
        return data;

        const amoled = ls("uxa_amoled", "0") === "1";
        const compact = ls("uxa_compact", "0") === "1";
        const reduce = ls("uxa_motion", "0") === "1";
        const dark = theme === "dark" || (theme !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.amoled = amoled && dark ? "1" : "0";
        document.documentElement.dataset.compact = compact ? "1" : "0";
        document.documentElement.classList.toggle("reduce-motion", reduce);
        document.documentElement.style.setProperty("--coral", ACCENTS[accent] || ACCENTS.indigo);
        document.documentElement.style.setProperty("--font-scale", font === "small" ? "0.9" : font === "large" ? "1.15" : "1");
        const fav = document.getElementById("site-favicon") || document.querySelector("link[rel='icon']");
        if (fav) fav.href = dark ? LOGO_DARK_URI : LOGO_LIGHT_URI;
        document.querySelectorAll("img.mark-logo").forEach((img) => {
          img.src = dark ? LOGO_DARK_URI : LOGO_LIGHT_URI;
        });
      }

      function lookPanel() {
        const theme = ls("uxa_theme", "system");
        const accent = ls("uxa_accent", "indigo");
        const font = ls("uxa_font", "normal");
        const amoled = ls("uxa_amoled", "0") === "1";
        const compact = ls("uxa_compact", "0") === "1";
        const reduce = ls("uxa_motion", "0") === "1";
        const smile = ls("uxa_smile", "apple");
        const themes = [["system", "System"], ["light", "Light"], ["dark", "Dark"]];
        const fonts = [["small", "Small"], ["normal", "Default"], ["large", "Large"]];
        const smileStyles = [["apple", "Apple"], ["google", "Google"], ["oneui", "OneUI"]];
        return `
          <p class="sec-label">Theme</p>
          <div class="tabs">${themes.map(([k, l]) => `<button class="chip ${theme === k ? "on" : ""}" data-theme="${k}">${l}</button>`).join("")}</div>
          <p class="sec-label">Accent color</p>
          <div class="row">${Object.entries(ACCENTS).map(([k, c]) =>
            `<div class="swatch ${accent === k ? "on" : ""}" data-accent="${k}" style="background:${c}" title="${k}"></div>`
          ).join("")}</div>
          <p class="sec-label">Text size</p>
          <div class="tabs">${fonts.map(([k, l]) => `<button class="chip ${font === k ? "on" : ""}" data-font="${k}">${l}</button>`).join("")}</div>
          <p class="sec-label">Smiles style</p>
          <div class="tabs">${smileStyles.map(([k, l]) => `<button class="chip ${smile === k ? "on" : ""}" data-smile="${k}">${l}</button>`).join("")}</div>
          <p class="sec-label">Display</p>
          <div class="tabs">
            <button class="chip ${amoled ? "on" : ""}" data-toggle="uxa_amoled">AMOLED ${amoled ? "on" : "off"}</button>
            <button class="chip ${compact ? "on" : ""}" data-toggle="uxa_compact">${compact ? "Compact" : "Comfortable"}</button>
            <button class="chip ${reduce ? "on" : ""}" data-toggle="uxa_motion">Reduce motion: ${reduce ? "on" : "off"}</button>
          </div>
        `;
      }

      function bindLook(el) {
        if (!el) return;
        el.querySelectorAll("[data-theme]").forEach((n) => n.onclick = () => {
          localStorage.setItem("uxa_theme", n.getAttribute("data-theme"));
          applyAppearance();
          render();
        });
        el.querySelectorAll("[data-accent]").forEach((n) => n.onclick = () => {
          localStorage.setItem("uxa_accent", n.getAttribute("data-accent"));
          applyAppearance();
          render();
        });
        el.querySelectorAll("[data-font]").forEach((n) => n.onclick = () => {
          localStorage.setItem("uxa_font", n.getAttribute("data-font"));
          applyAppearance();
          render();
        });
        el.querySelectorAll("[data-smile]").forEach((n) => n.onclick = () => {
          localStorage.setItem("uxa_smile", n.getAttribute("data-smile"));
          applyAppearance();
          render();
        });
        el.querySelectorAll("[data-toggle]").forEach((n) => n.onclick = () => {
          const k = n.getAttribute("data-toggle");
          localStorage.setItem(k, ls(k, "0") === "1" ? "0" : "1");
          applyAppearance();
          render();
        });
      }

      function authWrap(inner) {
        return `<div class="auth-only">
          <div class="auth-head">
            <div class="mark">${logoImg("mark-logo")}<span class="word">Uxaoro</span><span class="beta-tag">Beta</span></div>
            <button class="ghost" data-go="authsettings">${ico("gear")}<span>Settings</span></button>
          </div>
          ${inner}
        </div>`;
      }

      function legalConsent(buttonLabel) {
        const tou = "https://uxaoro.fourtexec.site/tou.txt";
        const pp = "https://uxaoro.fourtexec.site/pp.txt";
        return `<p class="tiny legal-consent">By pressing <b>${esc(buttonLabel)}</b> you agree to our <a href="${tou}" target="_blank" rel="noopener noreferrer">Terms of Use</a> and <a href="${pp}" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</p>`;
      }

      function countdownParts() {
        const diff = Math.max(0, BETA_OPEN_UTC - Date.now());
        const totalSecs = Math.floor(diff / 1000);
        const days = Math.floor(totalSecs / 86400);
        const hours = Math.floor((totalSecs % 86400) / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;
        return {
          expired: BETA_OPEN_UTC <= Date.now(),
          days: String(days).padStart(2, "0"),
          hours: String(hours).padStart(2, "0"),
          mins: String(mins).padStart(2, "0"),
          secs: String(secs).padStart(2, "0"),
        };
      }

      function countdownBlockHtml() {
        const c = countdownParts();
        return `
          <div class="cd-grid" id="cd-widget">
            <div class="cd-box"><p class="stat" id="cd-d">${c.days}</p><div class="tiny">Days</div></div>
            <div class="cd-box"><p class="stat" id="cd-h">${c.hours}</p><div class="tiny">Hours</div></div>
            <div class="cd-box"><p class="stat" id="cd-m">${c.mins}</p><div class="tiny">Minutes</div></div>
            <div class="cd-box"><p class="stat" id="cd-s">${c.secs}</p><div class="tiny">Seconds</div></div>
          </div>
          <p class="tiny" style="text-align:center;margin:0 0 6px">Beta release: <b>October 10 · 12:00 UTC</b></p>
        `;
      }

      function captchaBlockHtml() {
        if (!S.captchaEnabled) return "";
        if (S.captchaPass) {
          return `
            <div style="margin:10px 0;padding:10px 12px;border-radius:14px;background:var(--glass);display:flex;align-items:center;justify-content:space-between;gap:8px">
              <span class="tiny" id="captcha-status" style="color:#22C55E;font-weight:700">✓ Security check verified</span>
              <button type="button" class="ghost" id="f-captcha-reset" style="padding:4px 10px;font-size:11px">Reset</button>
            </div>
          `;
        }
        return `
          <div style="margin:10px 0;padding:12px;border-radius:14px;background:var(--glass)">
            <div class="row spread" style="margin-bottom:6px">
              <span class="tiny" style="font-weight:700;color:var(--ink)">Security check (CAPTCHA)</span>
            </div>
            <div id="cf-turnstile-box" style="min-height:65px;display:flex;align-items:center;justify-content:center"></div>
            <div class="tiny" id="captcha-status" style="margin-top:4px;min-height:1.1em"></div>
          </div>
        `;
      }

      function preregFormView() {
        if (S.pendingEmail) {
          const waitSec = Math.max(0, Math.ceil((S.resendUntil - Date.now()) / 1000));
          return authWrap(`<form class="card auth-card" onsubmit="return false">
            <h1>Check your email</h1>
            <p class="muted">We sent a 6-digit verification code to <b>${esc(S.pendingEmailAddr || "your email")}</b>. Enter it below to finish preregistering.</p>
            ${S.emailInfo ? `<p class="tiny" id="f-ok" style="color:#22C55E;font-weight:600;margin:0 0 8px">${esc(S.emailInfo)}</p>` : `<div id="f-ok"></div>`}
            <input id="f-email-code" placeholder="6-digit code" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            <div class="err" id="f-err"></div>
            <div style="height:12px"></div>
            <button type="submit" id="f-go">Verify email</button>
            <p class="tiny" style="margin-top:12px">
              <a id="f-resend" href="#">${waitSec > 0 ? `Resend code (${waitSec}s)` : "Resend email code"}</a>
              · <a id="f-back-reg" href="#">Change email</a>
            </p>
          </form>`);
        }
        return authWrap(`<form class="card auth-card" onsubmit="return false">
          <div class="row spread" style="margin-bottom:4px">
            <h1>Join Uxaoro</h1>
            <span class="chip on">Beta Preregistration</span>
          </div>
          <p class="muted">Reserve your account before Beta opens on October 10, 12:00 UTC.</p>
          <input id="f-user" placeholder="username" autocomplete="username" required>
          <div style="height:8px"></div>
          <input id="f-email" placeholder="email" type="email" autocomplete="email" required>
          <div style="height:8px"></div>
          <label class="tiny" for="f-dob" style="display:block;margin-bottom:4px">Date of birth (required, must be 13+)</label>
          <input id="f-dob" type="date" placeholder="Date of birth (YYYY-MM-DD)" required>
          <div style="height:8px"></div>
          <input id="f-pass" placeholder="password" type="password" autocomplete="new-password" required>
          ${captchaBlockHtml()}
          <div class="err" id="f-err"></div>
          <div style="height:12px"></div>
          ${legalConsent("Create account")}
          <button type="submit" id="f-go">Create account</button>
        </form>`);
      }

      function countdownOnlyView() {
        return authWrap(`<div class="card auth-card">
          <div class="row spread" style="margin-bottom:6px">
            <h1>You're in!</h1>
            <span class="chip on">✦ Reserved</span>
          </div>
          <p class="muted">
            ${S.registeredUser ? `Your handle <b>@${esc(S.registeredUser)}</b> is reserved.` : "Your Uxaoro account is reserved."}
            The Uxaoro app will unlock when the Beta release countdown reaches zero:
          </p>
          ${countdownBlockHtml()}
          <div style="height:12px"></div>
          <button class="ghost" id="f-another" style="width:100%">Preregister another account</button>
        </div>`);
      }

      function expiredRedirectView() {
        return authWrap(`<div class="card auth-card" style="text-align:center">
          <h1>Beta is Live</h1>
          <p class="muted">Preregistration has ended (October 10, 12:00 UTC). Redirecting to <b>uxaoro.fourtexec.site</b>…</p>
          <div style="height:12px"></div>
          <a href="${REDIRECT_URL}"><button type="button" style="width:100%">Open Uxaoro</button></a>
        </div>`);
      }

      function authSettingsView() {
        const backTarget = S.registeredUser ? "countdown" : "register";
        return authWrap(`<div class="card auth-card">
          <h1>Settings</h1>
          ${lookPanel()}
          <p class="tiny">Uxaoro v0.1.0</p>
          <div style="height:12px"></div>
          <button class="ghost" data-go="${backTarget}">${ico("back")}<span>Back</span></button>
        </div>`);
      }

      let didRedirect = false;
      function enforceReleaseCutoff() {
        if (Date.now() >= BETA_OPEN_UTC) {
          if (S.view !== "expired") {
            S.view = "expired";
            render();
          }
          if (!didRedirect) {
            didRedirect = true;
            try {
              window.location.replace(REDIRECT_URL);
            } catch (_) {
              window.location.href = REDIRECT_URL;
            }
          }
          return true;
        }
        return false;
      }

      function tickCountdownDom() {
        if (enforceReleaseCutoff()) return;
        const rLink = $("#f-resend");
        if (rLink && S.pendingEmail) {
          const waitSec = Math.max(0, Math.ceil((S.resendUntil - Date.now()) / 1000));
          rLink.textContent = waitSec > 0 ? `Resend code (${waitSec}s)` : "Resend email code";
        }
        const d = $("#cd-d"), h = $("#cd-h"), m = $("#cd-m"), s = $("#cd-s");
        if (!d || !h || !m || !s) return;
        const c = countdownParts();
        d.textContent = c.days;
        h.textContent = c.hours;
        m.textContent = c.mins;
        s.textContent = c.secs;
      }

      function validateAge13(dob) {
        if (!dob) throw new Error("Date of birth is required");
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dob);
        if (!m) throw new Error("Enter date of birth in YYYY-MM-DD format");
        const y = Number(m[1]), mo = Number(m[2]), dy = Number(m[3]);
        const birth = new Date(Date.UTC(y, mo - 1, dy));
        if (birth.getUTCFullYear() !== y || birth.getUTCMonth() !== mo - 1 || birth.getUTCDate() !== dy) {
          throw new Error("Invalid date of birth");
        }
        const now = new Date();
        let age = now.getUTCFullYear() - y;
        const md = (now.getUTCMonth() + 1 - mo) * 100 + (now.getUTCDate() - dy);
        if (md < 0) age -= 1;
        if (isNaN(age) || age < 13) {
          throw new Error("You must be at least 13 years old to register");
        }
      }

      async function submitPrereg() {
        if (enforceReleaseCutoff()) return;
        if (S.authBusy) return;
        snapshotDraft();
        S.authBusy = true;
        const err = $("#f-err");
        const goBtn = $("#f-go");
        if (err) err.textContent = "";
        if (goBtn) goBtn.disabled = true;
        try {
          if (S.pendingEmail) {
            const code = (($("#f-email-code") && $("#f-email-code").value) || "").trim();
            if (!/^\d{6}$/.test(code)) {
              throw new Error("Enter the 6-digit email verification code");
            }
            await api("/auth/register/verify", {
              method: "POST",
              body: { pending_token: S.pendingEmail, code },
            });
            setPendingEmail("", "");
            S.emailInfo = "";
            S.draft.code = "";
            // Do NOT open the Uxaoro app — transition to the Beta release countdown view
            S.view = "countdown";
            render();
            return;
          }
          const username = (($("#f-user") && $("#f-user").value) || "").trim();
          const email = (($("#f-email") && $("#f-email").value) || "").trim();
          const dob = (($("#f-dob") && $("#f-dob").value) || "").trim();
          const password = ($("#f-pass") && $("#f-pass").value) || "";
          validateAge13(dob);
          if (S.verifyPromise) {
            try { await S.verifyPromise; } catch (_) {}
          }
          if (!S.captchaPass && S.turnstileToken) {
            await verifyTurnstileToken(S.turnstileToken);
          }
          if (!S.captchaPass && window.turnstile && S.turnstileWidgetId != null) {
            try {
              const respTok = window.turnstile.getResponse(S.turnstileWidgetId);
              if (respTok) await verifyTurnstileToken(respTok);
            } catch (_) {}
          }
          if (S.captchaEnabled && !S.captchaPass) {
            throw new Error("Complete the CAPTCHA security check before continuing");
          }
          const reqBody = { username, email, password, display_name: username, dob };
          if (S.captchaPass) reqBody.captcha_pass = S.captchaPass;
          let pair;
          try {
            pair = await api("/auth/register", {
              method: "POST",
              body: reqBody,
            });
          } finally {
            // A captcha_pass is single-use on the server; reset widget for next attempt if needed
            S.captchaPass = "";
            S.verifiedTurnstileToken = "";
            S.turnstileToken = "";
            if (window.turnstile && S.turnstileWidgetId != null) {
              try { window.turnstile.reset(S.turnstileWidgetId); } catch (_) {}
            }
          }
          S.registeredUser = username;
          try { localStorage.setItem("uxa_prereg_user", username); } catch (_) {}
          if (pair && pair.requires_email && pair.pending_token) {
            const targetEmail = pair.email || email;
            setPendingEmail(pair.pending_token, targetEmail);
            S.emailInfo = `✓ Verification code sent to ${targetEmail}`;
            S.resendUntil = Date.now() + 45000;
            render();
            return;
          }
          // Registration complete: show countdown to October 10 12:00 UTC instead of entering app
          S.view = "countdown";
          render();
        } catch (e) {
          const msg = (e && e.message) || "Registration failed";
          if (/captcha/i.test(msg) && !document.getElementById("cf-turnstile-box")) {
            S.captchaEnabled = true;
            if (!S.captchaSiteKey) {
              S.captchaChecked = false;
              await loadCaptchaConfig();
            }
            render();
          }
          const errNow = $("#f-err");
          if (errNow) errNow.textContent = msg;
        } finally {
          S.authBusy = false;
          const b = $("#f-go");
          if (b) b.disabled = false;
        }
      }

      function render() {
        const root = $("#root");
        if (!root) return;
        snapshotDraft();
        if (Date.now() >= BETA_OPEN_UTC) {
          S.view = "expired";
        }
        if (S.view === "expired") {
          root.innerHTML = expiredRedirectView();
        } else if (S.view === "authsettings") {
          root.innerHTML = authSettingsView();
        } else if (S.view === "countdown") {
          root.innerHTML = countdownOnlyView();
        } else {
          root.innerHTML = preregFormView();
          restoreDraft();
          mountTurnstileWidget();
        }

        root.querySelectorAll("[data-go]").forEach((el) => {
          el.onclick = (e) => {
            e.preventDefault();
            snapshotDraft();
            S.view = el.getAttribute("data-go");
            render();
          };
        });
        bindLook(root);

        const goBtn = $("#f-go");
        if (goBtn) goBtn.onclick = (e) => { e.preventDefault(); submitPrereg(); };
        const form = root.querySelector("form.auth-card");
        if (form) form.onsubmit = (e) => { e.preventDefault(); submitPrereg(); };

        const capPopup = $("#f-captcha-popup");
        if (capPopup) capPopup.onclick = (e) => {
          e.preventDefault();
          snapshotDraft();
          S.captchaState = "web-" + Math.random().toString(36).slice(2, 12);
          const u = apiUrl("/auth/captcha?state=" + encodeURIComponent(S.captchaState) + "&mode=web");
          const w = window.open(u, "uxaoro_captcha", "width=480,height=560");
          if (!w) {
            S.captchaFrameOpen = true;
            render();
          }
        };
        const capReset = $("#f-captcha-reset");
        if (capReset) capReset.onclick = (e) => {
          e.preventDefault();
          snapshotDraft();
          S.captchaPass = "";
          render();
        };

        const backReg = $("#f-back-reg");
        if (backReg) backReg.onclick = (e) => {
          e.preventDefault();
          setPendingEmail("", "");
          S.emailInfo = "";
          render();
        };
        const resend = $("#f-resend");
        if (resend) resend.onclick = async (e) => {
          e.preventDefault();
          const box = $("#f-err");
          const okBox = $("#f-ok");
          if (Date.now() < S.resendUntil) {
            const left = Math.ceil((S.resendUntil - Date.now()) / 1000);
            if (box) box.textContent = `Please wait ${left}s before requesting another code`;
            return;
          }
          if (box) box.textContent = "";
          try {
            const r = await api("/auth/register/resend", { method: "POST", body: { pending_token: S.pendingEmail } });
            const addr = (r && r.email) || S.pendingEmailAddr || "your email";
            S.emailInfo = `✓ A new 6-digit code was sent to ${addr}`;
            S.resendUntil = Date.now() + 45000;
            if (okBox) {
              okBox.style.color = "#22C55E";
              okBox.style.fontWeight = "600";
              okBox.style.margin = "0 0 8px";
              okBox.className = "tiny";
              okBox.textContent = S.emailInfo;
            }
            tickCountdownDom();
          } catch (err) {
            if (box) box.textContent = err.message || "Could not resend verification email";
          }
        };
        const another = $("#f-another");
        if (another) another.onclick = (e) => {
          e.preventDefault();
          S.registeredUser = "";
          S.draft = { user: "", email: "", dob: "", pass: "", code: "" };
          try { localStorage.removeItem("uxa_prereg_user"); } catch (_) {}
          S.view = "register";
          render();
        };
      }

      applyAppearance();
      if (!enforceReleaseCutoff()) {
        S.view = S.registeredUser ? "countdown" : "register";
        render();
        loadCaptchaConfig();
      }
      setInterval(tickCountdownDom, 1000);
    })();
  </script>
</body>
</html>
